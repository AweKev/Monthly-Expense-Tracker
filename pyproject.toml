[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker"
version = "0.1.0"
description = "Automatic daily and monthly expense tracking from Mandiri transaction emails"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "rich>=13",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "tzdata",  # Windows has no built-in timezone database
    "python-telegram-bot[job-queue]>=21",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tracker = "expense_tracker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
